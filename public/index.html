<!DOCTYPE html>
<html lang="vi" data-theme="navygold">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0B1B2E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Sổ Chi" />
<meta name="robots" content="noindex, nofollow" />
<title>Sổ Chi</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<script>
  /* Ap theme truoc khi ve de khong nhay trang. Lan dau sau khi ra mat Navy Gold: chuyen sang Navy Gold mot lan. */
  (function () {
    try {
      if (!localStorage.getItem("sochi:ng-rollout")) {
        localStorage.setItem("sochi:theme", "navygold");
        localStorage.setItem("sochi:ng-rollout", "1");
      }
      var t = localStorage.getItem("sochi:theme") || "navygold";
      if (t === "auto") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<style>
  :root {
    --paper:  #FAFAF7;
    --card:   #FFFFFF;
    --ink:    #0F1729;
    --muted:  #6B7280;
    --line:   #E7E5DE;
    --track:  #EDEBE4;
    --chip:   #EDEBE4;
    --blue:   #2563EB;
    --green:  #0E9F6E;
    --amber:  #D97706;
    --red:    #DC2626;
    --onink:  #FFFFFF;
    --shadow: 0 1px 2px rgba(15,23,41,.05);
    --primary: var(--ink);
    --onprimary: var(--onink);
    --nav: var(--card);
  }
  [data-theme="dark"] {
    --paper:  #10131A;
    --card:   #171B24;
    --ink:    #E8E9EC;
    --muted:  #8B93A3;
    --line:   #262C38;
    --track:  #222834;
    --chip:   #222834;
    --blue:   #5B8DEF;
    --green:  #34C08B;
    --amber:  #E8A33D;
    --red:    #EF5D5D;
    --onink:  #10131A;
    --shadow: none;
  }

  /* ===== Navy Gold v1: nen navy ro den, net vang manh, vang dac chi cho hanh dong chinh ===== */
  [data-theme="navygold"] {
    --paper:  #0B1B2E;
    --card:   #102540;
    --ink:    #F4EEDF;
    --muted:  #A3B4CA;
    --line:   rgba(227,185,85,.18);
    --track:  #1A3352;
    --chip:   #1A3352;
    --blue:   #E3B955;
    --green:  #6FCB9F;
    --amber:  #E8935A;
    --red:    #EE7F76;
    --onink:  #0B1B2E;
    --shadow: none;
    --primary: #E3B955;
    --onprimary: #0B1B2E;
    --nav:    #07121F;
    --gold-soft: #F1D38B;
    color-scheme: dark;
  }
  [data-theme="navygold"] body {
    font-family: 'Be Vietnam Pro', system-ui, 'Segoe UI', sans-serif;
    background: radial-gradient(ellipse 90% 360px at 50% 0, rgba(140,170,210,.15), transparent 75%) no-repeat, var(--paper);
  }
  [data-theme="navygold"] .num { font-family: 'Be Vietnam Pro', system-ui, sans-serif; letter-spacing: -.005em; }
  [data-theme="navygold"] .label { color: var(--primary); opacity: .85; }
  [data-theme="navygold"] .box { background: linear-gradient(180deg, rgba(227,185,85,.04), rgba(227,185,85,0) 55%), var(--card); }
  [data-theme="navygold"] .tape::before { border-top-color: rgba(227,185,85,.14); }
  [data-theme="navygold"] .hero-num { font-weight: 300 !important; letter-spacing: -.03em !important; text-shadow: 0 0 28px rgba(227,185,85,.28); }
  [data-theme="navygold"] .sheet { background: radial-gradient(ellipse 90% 300px at 50% 0, rgba(140,170,210,.12), transparent 75%) no-repeat, var(--paper); }
  [data-theme="navygold"] .callout { border-color: rgba(227,185,85,.5); }
  [data-theme="navygold"] .callout-body strong { color: var(--gold-soft); }
  [data-theme="navygold"] ::selection { background: rgba(227,185,85,.35); }

  /* Khoi "Y chinh": dai mau dac ben trai + noi dung */
  .callout { display: grid; grid-template-columns: 50px 1fr; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); }
  .callout-mark { background: var(--primary); color: var(--onprimary); display: grid; place-items: center; }
  .callout-body { padding: 12px 14px; font-size: 13px; line-height: 1.55; }
  .callout-body strong { font-weight: 600; }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: 'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  .num { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  button { font: inherit; color: inherit; cursor: pointer; border: none; background: transparent; padding: 0; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--card); }
  button, input, select { transition: background .14s, border-color .14s, color .14s; }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--blue); outline-offset: 2px;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  .shell { max-width: 620px; margin: 0 auto; padding-bottom: 92px; }
  .pad { padding-left: 20px; padding-right: 20px; }
  .row { display: flex; align-items: center; }
  .between { display: flex; align-items: center; justify-content: space-between; }
  .wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tape { position: relative; }
  .tape::before { content:''; position:absolute; left:0; right:0; top:0; border-top:1px dashed var(--line); }

  .field {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); outline: none;
  }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  .label { font-size: 11px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }

  .sheet {
    position: fixed; inset: 0; z-index: 50;
    background: var(--paper); overflow-y: auto;
    animation: rise .18s ease-out;
  }
  @keyframes rise { from { transform: translateY(12px); opacity: .6 } to { transform: none; opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { *, .sheet { animation: none !important; transition: none !important; } }

  .spin { width: 15px; height: 15px; border: 2px solid var(--line); border-top-color: var(--ink);
          border-radius: 99px; animation: sp .7s linear infinite; display: inline-block; }
  @keyframes sp { to { transform: rotate(360deg) } }

  #boot { display:flex; align-items:center; justify-content:center; min-height:100vh; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<div id="root"><div id="boot">Đang mở sổ…</div></div>
<script src="/app.js"></script>
<script>
  // Dang ky service worker de app cai duoc ra man hinh chinh.
  // Chi giu phan vo tinh trong cache; so lieu tai chinh luon hoi may chu.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
