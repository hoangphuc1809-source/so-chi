<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#FAFAF7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Sổ Chi" />
<meta name="robots" content="noindex, nofollow" />
<title>Sổ Chi</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<style>
  :root {
    --paper:  #FAFAF7;
    --card:   #FFFFFF;
    --ink:    #0F1729;
    --muted:  #6B7280;
    --line:   #E7E5DE;
    --track:  #EDEBE4;
    --chip:   #EDEBE4;
    --blue:   #2563EB;
    --green:  #0E9F6E;
    --amber:  #D97706;
    --red:    #DC2626;
    --onink:  #FFFFFF;
    --shadow: 0 1px 2px rgba(15,23,41,.05);
  }
  [data-theme="dark"] {
    --paper:  #10131A;
    --card:   #171B24;
    --ink:    #E8E9EC;
    --muted:  #8B93A3;
    --line:   #262C38;
    --track:  #222834;
    --chip:   #222834;
    --blue:   #5B8DEF;
    --green:  #34C08B;
    --amber:  #E8A33D;
    --red:    #EF5D5D;
    --onink:  #10131A;
    --shadow: none;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: 'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  .num { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  button { font: inherit; color: inherit; cursor: pointer; border: none; background: transparent; padding: 0; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--card); }
  button, input, select { transition: background .14s, border-color .14s, color .14s; }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--blue); outline-offset: 2px;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  .shell { max-width: 620px; margin: 0 auto; padding-bottom: 92px; }
  .pad { padding-left: 20px; padding-right: 20px; }
  .row { display: flex; align-items: center; }
  .between { display: flex; align-items: center; justify-content: space-between; }
  .wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tape { position: relative; }
  .tape::before { content:''; position:absolute; left:0; right:0; top:0; border-top:1px dashed var(--line); }

  .field {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); outline: none;
  }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  .label { font-size: 11px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }

  .sheet {
    position: fixed; inset: 0; z-index: 50;
    background: var(--paper); overflow-y: auto;
    animation: rise .18s ease-out;
  }
  @keyframes rise { from { transform: translateY(12px); opacity: .6 } to { transform: none; opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { *, .sheet { animation: none !important; transition: none !important; } }

  .spin { width: 15px; height: 15px; border: 2px solid var(--line); border-top-color: var(--ink);
          border-radius: 99px; animation: sp .7s linear infinite; display: inline-block; }
  @keyframes sp { to { transform: rotate(360deg) } }

  #boot { display:flex; align-items:center; justify-content:center; min-height:100vh; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<div id="root"><div id="boot">Đang mở sổ…</div></div>
<script src="/app.js"></script>
<script>
  // Dang ky service worker de app cai duoc ra man hinh chinh.
  // Chi giu phan vo tinh trong cache; so lieu tai chinh luon hoi may chu.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
